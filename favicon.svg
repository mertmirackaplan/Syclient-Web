@font-face {
  font-family: "Geomini";
  src: url("./assets/fonts/Geomini-Regular.ttf") format("truetype");
  font-style: normal;
  font-weight: 400;
  font-display: swap;
}

@font-face {
  font-family: "Geomini";
  src: url("./assets/fonts/Geomini-Medium.ttf") format("truetype");
  font-style: normal;
  font-weight: 500;
  font-display: swap;
}

@font-face {
  font-family: "Geomini";
  src: url("./assets/fonts/Geomini-SemiBold.ttf") format("truetype");
  font-style: normal;
  font-weight: 600;
  font-display: swap;
}

:root {
  --black: #000000;
  --white: #f6f6f4;
  --muted: rgba(246, 246, 244, 0.68);
  --line: rgba(246, 246, 244, 0.18);
  --signal: #ee1d0b;
  --scroll-progress: 0;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  background: var(--black);
}

body {
  margin: 0;
  overflow-x: hidden;
  background: var(--black);
  color: var(--white);
  font-family: "Geomini", Arial, Helvetica, sans-serif;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}

::selection {
  color: var(--white);
  background: var(--signal);
}

a {
  color: inherit;
  text-decoration: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

a:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--white);
  outline-offset: 4px;
}

.site-shell {
  min-height: 100svh;
  background: var(--black);
}

.scroll-progress {
  position: fixed;
  z-index: 100;
  top: 0;
  right: 0;
  left: 0;
  height: 3px;
  background: var(--signal);
  transform: scaleX(var(--scroll-progress));
  transform-origin: left center;
  pointer-events: none;
  will-change: transform;
}

.site-header {
  position: relative;
  z-index: 20;
  width: 100%;
  animation: header-in 620ms cubic-bezier(0.22, 0.72, 0.2, 1) both;
}

.header-inner {
  width: min(1248px, calc(100% - 48px));
  height: 92px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
}

.brand {
  width: 148px;
  height: 25px;
  display: block;
  justify-self: start;
}

.wordmark {
  position: relative;
  display: block;
  width: 148px;
  height: 25px;
  overflow: hidden;
}

.wordmark img {
  position: absolute;
  top: -47px;
  left: -11px;
  width: 176px;
  max-width: none;
  height: auto;
  filter: invert(1);
  mix-blend-mode: screen;
  user-select: none;
  transition: opacity 180ms ease, transform 280ms cubic-bezier(0.22, 0.72, 0.2, 1);
}

.brand:hover .wordmark img,
.brand:focus-visible .wordmark img {
  opacity: 0.72;
  transform: translateX(4px);
}

.desktop-nav {
  display: flex;
  align-items: center;
  justify-self: center;
  gap: clamp(24px, 2vw, 34px);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.desktop-nav a {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  color: #ffffff;
  transition: color 160ms ease;
}

.desktop-nav a::after {
  content: "";
  position: absolute;
  right: 100%;
  bottom: 3px;
  left: 0;
  height: 1px;
  background: var(--white);
  transition: right 220ms cubic-bezier(0.22, 0.72, 0.2, 1);
}

.desktop-nav a:hover,
.desktop-nav a:focus-visible {
  color: var(--white);
}

.desktop-nav a:hover::after,
.desktop-nav a:focus-visible::after {
  right: 0;
}

.desktop-nav a span {
  font-size: 13px;
  transform: translateY(-2px);
}

.product-menu {
  position: relative;
}

.product-menu-trigger > span {
  transition: transform 180ms ease;
}

.product-menu:hover .product-menu-trigger > span,
.product-menu:focus-within .product-menu-trigger > span {
  transform: translateY(1px) rotate(180deg);
}

.product-menu-panel {
  position: absolute;
  z-index: 40;
  top: calc(100% + 14px);
  left: 50%;
  width: 318px;
  padding: 8px;
  color: var(--white);
  background: rgba(10, 10, 10, 0.97);
  border: 1px solid rgba(246, 246, 244, 0.2);
  border-top: 2px solid var(--signal);
  border-radius: 8px;
  box-shadow: 0 26px 70px rgba(0, 0, 0, 0.56);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 10px);
  transition:
    opacity 180ms ease,
    transform 240ms cubic-bezier(0.22, 0.72, 0.2, 1);
}

.product-menu-panel::before {
  content: "";
  position: absolute;
  right: 0;
  bottom: 100%;
  left: 0;
  height: 18px;
}

.product-menu:hover .product-menu-panel,
.product-menu:focus-within .product-menu-panel {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, 0);
}

.product-menu-panel > a,
.product-menu-disabled {
  min-height: 78px;
  padding: 14px 13px;
  display: grid;
  grid-template-columns: 30px 1fr auto;
  gap: 12px;
  align-items: center;
  border-bottom: 1px solid rgba(246, 246, 244, 0.13);
  border-radius: 5px;
}

.product-menu-panel > a::after {
  display: none;
}

.product-menu-panel > a:hover,
.product-menu-panel > a:focus-visible {
  color: var(--black);
  background: var(--white);
}

.product-menu-panel > a > span,
.product-menu-disabled > span {
  transform: none;
}

.product-menu-number {
  color: rgba(246, 246, 244, 0.38);
  font-size: 9px !important;
  letter-spacing: 0.08em;
}

.product-menu-panel > a:hover .product-menu-number,
.product-menu-panel > a:focus-visible .product-menu-number {
  color: rgba(0, 0, 0, 0.42);
}

.product-menu-name {
  display: grid;
  gap: 6px;
  font-size: 15px !important;
  line-height: 1;
}

.product-menu-name small {
  color: rgba(246, 246, 244, 0.44);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.product-menu-panel > a:hover small,
.product-menu-panel > a:focus-visible small {
  color: rgba(0, 0, 0, 0.46);
}

.product-menu-panel > a > span:last-child {
  font-size: 16px;
  transition: transform 180ms ease;
}

.product-menu-panel > a:hover > span:last-child,
.product-menu-panel > a:focus-visible > span:last-child {
  transform: translate(3px, -3px);
}

.product-menu-disabled {
  border-bottom: 0;
  opacity: 0.36;
  cursor: not-allowed;
}

.contact-button {
  width: 112px;
  height: 50px;
  display: grid;
  place-items: center;
  justify-self: end;
  border: 1px solid var(--white);
  border-radius: 7px;
  color: var(--black);
  background: var(--white);
  font-size: 14px;
  font-weight: 600;
  transition: color 170ms ease, background 170ms ease;
}

.contact-button:hover,
.contact-button:focus-visible {
  color: var(--white);
  background: transparent;
}

.mobile-nav {
  display: none;
}

.product-hero {
  width: min(1248px, calc(100% - 48px));
  min-height: calc(100svh - 92px);
  margin: 0 auto;
  padding: clamp(96px, 12vh, 144px) 0 clamp(92px, 11vh, 132px);
  display: grid;
  place-items: center;
  scroll-margin-top: 24px;
}

.product-copy {
  width: min(1120px, 92vw);
  margin: 0 auto;
  text-align: center;
  animation: copy-reveal 720ms 90ms cubic-bezier(0.22, 0.72, 0.2, 1) both;
}

.product-copy h1 {
  max-width: 1120px;
  margin: 0 auto;
  font-size: clamp(54px, 6.4vw, 96px);
  font-weight: 500;
  line-height: 0.99;
  letter-spacing: -0.066em;
  text-wrap: balance;
}

.agent-highlight {
  display: inline-block;
  padding: 0.04em 0.14em 0.1em;
  border-radius: 2px;
  color: #050505;
  background: #ffffff;
  line-height: 0.9;
}

.primary-cta {
  width: max-content;
  min-width: 218px;
  height: 52px;
  margin: clamp(76px, 10vh, 104px) auto 0;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
  border-radius: 6px;
  color: var(--white);
  background: var(--signal);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  transition: color 180ms ease, background 180ms ease, transform 180ms ease;
}

.primary-cta:hover,
.primary-cta:focus-visible {
  color: var(--signal);
  background: var(--white);
  transform: translateY(-2px);
}

.primary-cta span,
.model-cta span,
.about-cta span {
  transition: transform 180ms cubic-bezier(0.22, 0.72, 0.2, 1);
}

.primary-cta:hover span,
.primary-cta:focus-visible span,
.model-cta:hover span,
.model-cta:focus-visible span,
.about-cta:hover span,
.about-cta:focus-visible span {
  transform: translate(3px, -3px);
}

.model-section {
  min-height: 72svh;
  display: grid;
  align-items: center;
  border-top: 1px solid var(--line);
  background:
    radial-gradient(circle at 50% 50%, rgba(33, 96, 128, 0.12), transparent 32%),
    var(--black);
  scroll-margin-top: 24px;
}

.model-section-inner {
  width: min(1248px, calc(100% - 48px));
  margin: 0 auto;
  padding: clamp(82px, 10vh, 120px) 0;
}

.model-copy {
  width: min(820px, 100%);
  margin: 0 auto;
  text-align: center;
}

.model-copy h2 {
  margin: 0;
  font-size: clamp(42px, 5vw, 74px);
  font-weight: 600;
  line-height: 0.98;
  letter-spacing: -0.06em;
  text-wrap: balance;
}

.model-copy p {
  max-width: 620px;
  margin: 28px 0 0;
  margin-inline: auto;
  color: rgba(246, 246, 244, 0.84);
  font-size: clamp(18px, 1.55vw, 23px);
  line-height: 1.18;
  letter-spacing: -0.03em;
}

.model-cta {
  width: max-content;
  min-width: 178px;
  height: 50px;
  margin: 36px auto 0;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-radius: 5px;
  background: var(--signal);
  color: var(--white);
  font-size: 12px;
  font-weight: 600;
  transition: color 180ms ease, background 180ms ease, transform 180ms ease;
}

.model-cta:hover,
.model-cta:focus-visible {
  color: var(--signal);
  background: var(--white);
  transform: translateY(-2px);
}

.research-section {
  position: relative;
  overflow: hidden;
  color: #0a0a0a;
  background: #f1f1ec;
  scroll-margin-top: 0;
}

.research-section::before {
  content: "";
  position: absolute;
  z-index: 2;
  top: 0;
  right: 0;
  left: 0;
  height: 6px;
  background: var(--signal);
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 900ms cubic-bezier(0.22, 0.72, 0.2, 1);
}

.research-section.section-active::before {
  transform: scaleX(1);
}

.research-inner {
  width: min(1248px, calc(100% - 48px));
  margin: 0 auto;
  padding: clamp(100px, 12vh, 150px) 0 clamp(100px, 12vh, 150px);
}

.research-header {
  display: grid;
  grid-template-columns: minmax(180px, 0.34fr) minmax(0, 1fr);
  gap: clamp(64px, 9vw, 148px);
  align-items: start;
}

.research-meta {
  padding-top: 9px;
}

.research-meta p {
  margin: 0;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.research-kicker {
  margin: 0 0 24px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.research-title-block h2 {
  max-width: 900px;
  margin: 0;
  font-size: clamp(62px, 7.25vw, 112px);
  font-weight: 500;
  line-height: 0.88;
  letter-spacing: -0.073em;
  text-wrap: balance;
}

.research-intro {
  max-width: 720px;
  margin: 54px 0 0;
  color: rgba(10, 10, 10, 0.68);
  font-size: clamp(19px, 1.7vw, 27px);
  line-height: 1.26;
  letter-spacing: -0.035em;
}

.research-thesis {
  margin-top: clamp(100px, 13vh, 154px);
  padding: clamp(36px, 5vw, 68px) 0;
  display: grid;
  grid-template-columns: 0.34fr 1fr;
  gap: clamp(64px, 9vw, 148px);
  align-items: start;
  border-top: 1px solid rgba(10, 10, 10, 0.82);
  border-bottom: 1px solid rgba(10, 10, 10, 0.82);
}

.research-thesis > p {
  margin: 9px 0 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.research-thesis blockquote {
  margin: 0;
  font-size: clamp(42px, 5vw, 76px);
  font-weight: 400;
  line-height: 0.98;
  letter-spacing: -0.06em;
}

.research-thesis strong {
  font-weight: 600;
}

.research-areas-heading {
  margin-top: clamp(84px, 10vh, 120px);
  padding-bottom: 24px;
  display: flex;
  align-items: end;
  justify-content: space-between;
  border-bottom: 1px solid rgba(10, 10, 10, 0.82);
}

.research-areas-heading h3,
.research-areas-heading p {
  margin: 0;
}

.research-areas-heading h3 {
  font-size: clamp(34px, 3.5vw, 52px);
  font-weight: 500;
  letter-spacing: -0.05em;
}

.research-areas-heading p {
  color: rgba(10, 10, 10, 0.52);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.research-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.research-card {
  min-height: 250px;
  padding: 28px clamp(24px, 3vw, 44px) 32px;
  display: grid;
  grid-template-rows: auto 1fr;
  border-bottom: 1px solid rgba(10, 10, 10, 0.28);
}

.research-card:first-child {
  padding-left: 0;
}

.research-card:not(:last-child) {
  border-right: 1px solid rgba(10, 10, 10, 0.28);
}

.research-card:last-child {
  padding-right: 0;
}

.research-number {
  margin: 0 0 54px;
  color: rgba(10, 10, 10, 0.46);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
}

.research-card h4 {
  max-width: 470px;
  margin: 0;
  font-size: clamp(28px, 2.7vw, 42px);
  font-weight: 500;
  line-height: 1.02;
  letter-spacing: -0.05em;
}

.research-direction {
  margin-top: clamp(110px, 15vh, 180px);
  padding-top: 28px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(420px, 0.9fr);
  gap: clamp(70px, 9vw, 140px);
  border-top: 1px solid rgba(10, 10, 10, 0.82);
}

.research-direction > div:first-child h3 {
  max-width: 680px;
  margin: 0;
  font-size: clamp(40px, 4.4vw, 68px);
  font-weight: 500;
  line-height: 0.99;
  letter-spacing: -0.06em;
}

.research-planes article {
  padding: 0 0 36px;
  border-bottom: 1px solid rgba(10, 10, 10, 0.28);
}

.research-planes article + article {
  padding-top: 36px;
}

.research-planes span {
  color: rgba(10, 10, 10, 0.46);
  font-size: 10px;
  font-weight: 600;
}

.research-planes h4 {
  margin: 18px 0 14px;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.04em;
}

.research-planes p {
  margin: 0;
  color: rgba(10, 10, 10, 0.64);
  font-size: 15px;
  line-height: 1.48;
}

.research-closing {
  margin-top: clamp(110px, 14vh, 170px);
  padding: clamp(54px, 7vw, 90px);
  display: grid;
  grid-template-columns: 0.72fr 1fr;
  gap: 70px;
  color: var(--white);
  background: #0a0a0a;
}

.research-closing p {
  margin: 0;
}

.research-closing p:first-child {
  font-size: clamp(24px, 2.7vw, 40px);
  font-weight: 600;
  letter-spacing: -0.05em;
}

.research-closing p:last-child {
  font-size: clamp(21px, 2.2vw, 33px);
  line-height: 1.16;
  letter-spacing: -0.04em;
}

.news-section,
.about-section {
  color: var(--white);
  background: var(--black);
  scroll-margin-top: 0;
}

.news-inner,
.about-inner {
  width: min(1248px, calc(100% - 48px));
  margin: 0 auto;
}

.news-inner {
  padding: clamp(105px, 13vh, 160px) 0 clamp(120px, 15vh, 190px);
}

.dark-section-header {
  display: grid;
  grid-template-columns: 0.34fr 1fr;
  gap: clamp(64px, 9vw, 148px);
  align-items: start;
}

.dark-section-header > p,
.about-title > p {
  margin: 8px 0 0;
  color: rgba(246, 246, 244, 0.46);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.dark-section-header h2 {
  margin: 0;
  font-size: clamp(64px, 7.8vw, 118px);
  font-weight: 500;
  line-height: 0.88;
  letter-spacing: -0.075em;
}

.news-list {
  margin-top: clamp(92px, 12vh, 144px);
  border-top: 1px solid var(--line);
}

.news-item {
  min-height: 210px;
  display: grid;
  grid-template-columns: 0.23fr 1fr auto;
  gap: 44px;
  align-items: center;
  border-bottom: 1px solid var(--line);
  transition: color 180ms ease, background 180ms ease, padding 180ms ease;
}

.news-item:hover,
.news-item:focus-visible {
  padding: 0 22px;
  color: var(--black);
  background: var(--white);
}

.news-order {
  color: rgba(246, 246, 244, 0.42);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
}

.news-item:hover .news-order,
.news-item:focus-visible .news-order,
.news-item:hover .news-copy p,
.news-item:focus-visible .news-copy p {
  color: rgba(0, 0, 0, 0.48);
}

.news-copy p {
  margin: 0 0 14px;
  color: rgba(246, 246, 244, 0.48);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.news-copy h3 {
  max-width: 850px;
  margin: 0;
  font-size: clamp(27px, 3vw, 45px);
  font-weight: 500;
  line-height: 1.06;
  letter-spacing: -0.05em;
}

.news-arrow {
  font-size: 28px;
  transition: transform 180ms cubic-bezier(0.22, 0.72, 0.2, 1);
}

.news-item:hover .news-arrow,
.news-item:focus-visible .news-arrow {
  transform: translate(4px, -4px);
}

.about-section {
  border-top: 1px solid var(--line);
}

.about-inner {
  min-height: 88svh;
  padding: clamp(110px, 14vh, 170px) 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(420px, 0.72fr);
  gap: clamp(80px, 10vw, 160px);
  align-items: start;
}

.about-title h2 {
  max-width: 710px;
  margin: 40px 0 0;
  font-size: clamp(60px, 7vw, 106px);
  font-weight: 500;
  line-height: 0.9;
  letter-spacing: -0.075em;
}

.about-copy > p {
  margin: 42px 0 0;
  color: rgba(246, 246, 244, 0.7);
  font-size: clamp(19px, 1.65vw, 25px);
  line-height: 1.28;
  letter-spacing: -0.03em;
}

.about-principles {
  margin-top: 64px;
  border-top: 1px solid var(--line);
}

.about-principles p {
  margin: 0;
  padding: 20px 0;
  display: grid;
  grid-template-columns: 48px 1fr;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
}

.about-principles span {
  color: rgba(246, 246, 244, 0.38);
  font-size: 9px;
}

.about-cta {
  width: max-content;
  min-width: 214px;
  height: 52px;
  margin-top: 48px;
  padding: 0 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  border-radius: 5px;
  color: var(--white);
  background: var(--signal);
  font-size: 12px;
  font-weight: 600;
  transition: color 180ms ease, background 180ms ease, transform 180ms ease;
}

.about-cta:hover,
.about-cta:focus-visible {
  color: var(--signal);
  background: var(--white);
  transform: translateY(-2px);
}

.site-footer {
  min-height: 72px;
  padding: 0 max(24px, calc((100% - 1248px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  color: rgba(246, 246, 244, 0.46);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.site-footer p {
  margin: 0;
}

.spm-shell {
  position: relative;
  min-height: 100svh;
  overflow: hidden;
}

.spm-hero {
  position: relative;
  isolation: isolate;
  min-height: calc(100svh - 164px);
  padding: clamp(76px, 10vh, 120px) 24px clamp(88px, 12vh, 140px);
