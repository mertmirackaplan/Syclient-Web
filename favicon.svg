/* Mosaic Agent — capability product page */
.ma-page {
  --ma-paper: #f2f1ed;
  --ma-ink: #090909;
  --ma-panel: #131313;
  --ma-panel-line: rgba(255, 255, 255, 0.12);
  --ma-soft: rgba(9, 9, 9, 0.62);
  position: relative;
  overflow: clip;
  background: var(--black);
}

.ma-site-header {
  color: var(--white);
  background: var(--black);
}

.ma-hero {
  min-height: calc(100svh - 92px);
  padding: clamp(92px, 12vh, 142px) 24px clamp(96px, 13vh, 154px);
  display: grid;
  place-items: center;
  color: var(--white);
  background:
    radial-gradient(circle at 50% 43%, rgba(35, 108, 139, 0.16), transparent 33%),
    linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
    var(--black);
  background-size: auto, 76px 76px, 76px 76px, auto;
}

.ma-hero-inner {
  width: min(1180px, 100%);
  display: grid;
  justify-items: center;
  text-align: center;
}

.ma-eyebrow {
  margin: 0 0 34px;
  color: rgba(246, 246, 244, 0.54);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.ma-title {
  max-width: 1080px;
  margin: 0;
  display: grid;
  justify-items: center;
  font-size: clamp(66px, 8.1vw, 126px);
  font-weight: 500;
  line-height: 0.88;
  letter-spacing: -0.076em;
  text-wrap: balance;
}

.ma-title-invert {
  width: fit-content;
  margin-top: 0.08em;
  padding: 0.04em 0.13em 0.1em;
  color: var(--black);
  background: var(--white);
  border-radius: 3px;
}

.ma-intro {
  max-width: 720px;
  margin: 48px 0 0;
  color: rgba(246, 246, 244, 0.68);
  font-size: clamp(18px, 1.65vw, 25px);
  line-height: 1.35;
  letter-spacing: -0.03em;
}

.ma-hero-metrics {
  width: min(830px, 100%);
  margin-top: clamp(62px, 9vh, 92px);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.ma-hero-metrics p {
  min-height: 112px;
  margin: 0;
  padding: 24px 28px;
  display: grid;
  place-content: center;
  gap: 9px;
}

.ma-hero-metrics p + p {
  border-left: 1px solid var(--line);
}

.ma-hero-metrics strong {
  font-size: clamp(26px, 2.5vw, 38px);
  font-weight: 500;
  letter-spacing: -0.05em;
}

.ma-hero-metrics span {
  color: rgba(246, 246, 244, 0.45);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.ma-scroll-link {
  margin-top: 46px;
  display: inline-flex;
  align-items: center;
  gap: 18px;
  font-size: 14px;
  font-weight: 600;
}

.ma-scroll-link span {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(246, 246, 244, 0.3);
  border-radius: 50%;
  transition: color 180ms ease, background 180ms ease, transform 180ms ease;
}

.ma-scroll-link:hover span,
.ma-scroll-link:focus-visible span {
  color: var(--black);
  background: var(--white);
  transform: translateY(3px);
}

.ma-capabilities {
  background: var(--ma-paper);
}

.ma-capability {
  position: relative;
  min-height: 860px;
  padding: clamp(104px, 13vh, 152px) 24px;
  display: grid;
  place-items: center;
  color: var(--ma-ink);
  background: var(--ma-paper);
  border-top: 1px solid rgba(9, 9, 9, 0.14);
}

.ma-capability--dark {
  color: var(--white);
  background:
    radial-gradient(circle at 76% 42%, rgba(33, 96, 128, 0.13), transparent 30%),
    var(--black);
  border-top-color: var(--line);
}

.ma-capability-inner {
  width: min(1248px, 100%);
  display: grid;
  grid-template-columns: minmax(0, 0.82fr) minmax(520px, 1.18fr);
  gap: clamp(64px, 8vw, 126px);
  align-items: center;
}

.ma-capability-copy {
  min-width: 0;
}

.ma-index {
  margin: 0 0 34px;
  color: currentColor;
  opacity: 0.5;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.ma-capability h2 {
  max-width: 570px;
  margin: 0;
  font-size: clamp(52px, 5vw, 78px);
  font-weight: 500;
  line-height: 0.94;
  letter-spacing: -0.065em;
  text-wrap: balance;
}

.ma-description {
  max-width: 590px;
  margin: 38px 0 0;
  color: var(--ma-soft);
  font-size: clamp(17px, 1.45vw, 21px);
  line-height: 1.48;
  letter-spacing: -0.022em;
}

.ma-capability--dark .ma-description {
  color: rgba(246, 246, 244, 0.66);
}

.ma-core-idea {
  max-width: 570px;
  margin: 36px 0 0;
  padding: 20px 22px;
  display: grid;
  gap: 10px;
  border-left: 3px solid var(--signal);
  color: var(--ma-ink);
  background: rgba(9, 9, 9, 0.045);
  font-size: clamp(18px, 1.55vw, 23px);
  font-weight: 500;
  line-height: 1.3;
  letter-spacing: -0.025em;
}

.ma-capability--dark .ma-core-idea {
  color: var(--white);
  background: rgba(255, 255, 255, 0.055);
}

.ma-core-idea span {
  color: currentColor;
  opacity: 0.48;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.ma-tags {
  margin-top: 42px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.ma-tags span {
  min-height: 34px;
  padding: 0 13px;
  display: inline-flex;
  align-items: center;
  border: 1px solid rgba(9, 9, 9, 0.2);
  border-radius: 999px;
  color: rgba(9, 9, 9, 0.72);
  font-size: 11px;
  font-weight: 600;
}

.ma-capability--dark .ma-tags span {
  color: rgba(246, 246, 244, 0.72);
  border-color: rgba(246, 246, 244, 0.2);
}

.ma-demo {
  position: relative;
  min-height: 520px;
  overflow: hidden;
  color: #f4f4f0;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.035), transparent 38%),
    var(--ma-panel);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 16px;
  box-shadow:
    0 34px 90px rgba(0, 0, 0, 0.28),
    inset 0 1px rgba(255, 255, 255, 0.05);
  font-family: "Geomini", Arial, Helvetica, sans-serif;
}

.ma-capability:not(.ma-capability--dark) .ma-demo {
  box-shadow:
    0 38px 90px rgba(9, 9, 9, 0.22),
    inset 0 1px rgba(255, 255, 255, 0.05);
}

.ma-demo::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 5;
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.025);
  pointer-events: none;
}

.ma-demo-bar {
  min-height: 54px;
  padding: 0 18px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 16px;
  align-items: center;
  color: rgba(246, 246, 244, 0.54);
  border-bottom: 1px solid var(--ma-panel-line);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.ma-demo-dots {
  display: flex;
  gap: 6px;
}

.ma-demo-dots i {
  width: 9px;
  height: 9px;
  display: block;
  border-radius: 50%;
  background: #ff5f57;
}

.ma-demo-dots i:nth-child(2) {
  background: #febc2e;
}

.ma-demo-dots i:nth-child(3) {
  background: #28c840;
}

.ma-demo-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ma-demo-status {
  color: #74d75f;
}

.ma-token-task {
  margin: 30px 30px 0;
  padding: 22px 24px;
  display: grid;
  gap: 9px;
  border: 1px solid var(--ma-panel-line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.035);
}

.ma-token-task span,
.ma-route-request span,
.ma-memory-list article > span {
  color: rgba(246, 246, 244, 0.42);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.ma-token-task strong {
  font-size: 19px;
  font-weight: 500;
}

.ma-token-bars {
  margin: 32px 30px 0;
  display: grid;
  gap: 24px;
}

.ma-token-bars > div {
  display: grid;
  grid-template-columns: 118px 1fr 52px;
  gap: 14px;
  align-items: center;
  color: rgba(246, 246, 244, 0.58);
  font-size: 11px;
}

.ma-token-bars i {
  position: relative;
  height: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
}

.ma-token-bars i::after {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--ma-fill);
  border-radius: inherit;
  background: var(--signal);
  animation: ma-bar-in 1.2s cubic-bezier(0.22, 0.72, 0.2, 1) both;
}

.ma-token-bars > div:nth-child(2) i::after {
  background: #6bcb5f;
}

.ma-token-bars b {
  color: var(--white);
  font-size: 12px;
  text-align: right;
}

.ma-terminal-lines {
  margin: 34px 30px 0;
  padding: 22px 24px;
  display: grid;
  gap: 16px;
  color: rgba(246, 246, 244, 0.7);
  border-top: 1px solid var(--ma-panel-line);
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
}

.ma-terminal-lines p {
  margin: 0;
}

.ma-terminal-lines em {
  width: 24px;
  display: inline-block;
  color: #75d962;
  font-style: normal;
}

.ma-memory-query {
  margin: 28px 28px 0 auto;
  width: fit-content;
  max-width: calc(100% - 56px);
  padding: 13px 17px;
  color: #171717;
  background: #f3f2ee;
  border-radius: 16px 16px 4px 16px;
  font-size: 13px;
}

.ma-memory-list {
  margin: 26px 28px 0;
  display: grid;
  gap: 12px;
}

.ma-memory-list article {
  padding: 18px 20px;
  display: grid;
  grid-template-columns: 92px 1fr;
  gap: 6px 14px;
  border: 1px solid var(--ma-panel-line);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.035);
}

.ma-memory-list article > span {
  grid-row: 1 / 3;
  color: #8ccfff;
}

.ma-memory-list strong {
  font-size: 14px;
  font-weight: 500;
}

.ma-memory-list p {
  margin: 0;
  color: rgba(246, 246, 244, 0.5);
  font-size: 11px;
  line-height: 1.35;
}

.ma-tool-plan {
  padding: 24px 28px;
  display: grid;
  gap: 2px;
  border-bottom: 1px solid var(--ma-panel-line);
}

.ma-tool-plan p {
  margin: 0;
  padding: 13px 14px;
  display: grid;
  grid-template-columns: 30px 1fr auto;
  gap: 12px;
  align-items: center;
  border-radius: 6px;
  color: rgba(246, 246, 244, 0.54);
  font-size: 11px;
}

.ma-tool-plan p.is-active {
  color: var(--white);
  background: rgba(238, 29, 11, 0.11);
}

.ma-tool-plan span {
  opacity: 0.5;
}

.ma-tool-plan b {
  font-size: 13px;
  font-weight: 500;
}

.ma-tool-plan em {
  color: #71d45e;
  font-size: 9px;
  font-style: normal;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.ma-tool-plan .is-active em {
  color: #ff7668;
  animation: ma-pulse 1.2s ease infinite;
}

.ma-code-window {
  padding: 24px 28px 30px;
  display: grid;
  gap: 13px;
  color: rgba(246, 246, 244, 0.7);
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
}

.ma-code-window p {
  margin: 0;
}

.ma-code-window p i {
  color: #50cee6;
  font-style: normal;
}

.ma-code-window small {
  color: rgba(246, 246, 244, 0.35);
}

.ma-code-window code {
  padding: 8px 10px;
  color: #e8e8e3;
  background: rgba(255, 255, 255, 0.04);
}

.ma-code-window code span {
  margin-right: 14px;
  color: rgba(246, 246, 244, 0.3);
}

.ma-code-window code.is-added {
  background: rgba(86, 164, 64, 0.16);
}

.ma-route-request {
  margin: 28px;
  padding: 20px;
  display: grid;
  gap: 8px;
  border: 1px solid var(--ma-panel-line);
  border-radius: 9px;
}

.ma-route-request strong {
  font-size: 17px;
  font-weight: 500;
}

.ma-route-map {
  margin: 0 28px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.ma-route-map div {
  min-height: 64px;
  padding: 12px 14px;
  display: grid;
  gap: 5px;
  border: 1px solid var(--ma-panel-line);
  border-radius: 7px;
  color: rgba(246, 246, 244, 0.48);
}

.ma-route-map div.is-selected {
  color: var(--white);
  border-color: rgba(238, 29, 11, 0.8);
  background: rgba(238, 29, 11, 0.13);
}

.ma-route-map span {
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.ma-route-map b {
  font-size: 13px;
  font-weight: 500;
}

.ma-route-result {
  margin: 24px 28px 0;
  padding-top: 18px;
  display: flex;
  gap: 10px;
  color: rgba(246, 246, 244, 0.6);
  border-top: 1px solid var(--ma-panel-line);
  font-size: 11px;
  line-height: 1.4;
}

.ma-route-result i {
  width: 8px;
  height: 8px;
  margin-top: 3px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: #72d35e;
  animation: ma-pulse 1.4s ease infinite;
}

.ma-workspace-layout {
  min-height: 465px;
  display: grid;
  grid-template-columns: 170px 1fr;
}

.ma-workspace-layout aside {
  padding: 26px 18px;
  display: grid;
  align-content: start;
  gap: 5px;
  border-right: 1px solid var(--ma-panel-line);
  background: rgba(255, 255, 255, 0.02);
}

.ma-workspace-layout aside strong {
  margin: 0 8px 20px;
  font-size: 14px;
  font-weight: 500;
}

.ma-workspace-layout aside span {
  min-height: 38px;
  padding: 0 9px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: rgba(246, 246, 244, 0.46);
  border-radius: 6px;
  font-size: 11px;
}

.ma-workspace-layout aside span.is-active {
  color: var(--white);
  background: rgba(255, 255, 255, 0.07);
}

.ma-workspace-layout aside b {
  color: rgba(246, 246, 244, 0.28);
  font-size: 9px;
}

.ma-workspace-main {
  padding: 26px;
}

.ma-resume-card {
  padding: 20px;
  display: grid;
  gap: 8px;
  border: 1px solid rgba(99, 192, 234, 0.28);
  border-radius: 9px;
  background: rgba(49, 130, 168, 0.08);
}

.ma-resume-card span {
  color: #79c7ec;
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.09em;
}

.ma-resume-card strong {
  font-size: 16px;
  font-weight: 500;
}

.ma-resume-card p {
  margin: 0;
  color: rgba(246, 246, 244, 0.44);
  font-size: 10px;
}

.ma-workspace-main ul {
  margin: 24px 0 0;
  padding: 0;
  display: grid;
  list-style: none;
}

.ma-workspace-main li {
  min-height: 48px;
  padding-left: 28px;
  display: flex;
  align-items: center;
  color: rgba(246, 246, 244, 0.46);
  border-bottom: 1px solid var(--ma-panel-line);
  font-size: 12px;
}

.ma-workspace-main li::before {
  content: "";
  width: 9px;
  height: 9px;
  margin-left: -26px;
  margin-right: 16px;
  border: 1px solid rgba(246, 246, 244, 0.34);
  border-radius: 50%;
}

.ma-workspace-main li.is-done {
  color: rgba(246, 246, 244, 0.34);
  text-decoration: line-through;
}

.ma-workspace-main li.is-done::before {
  border-color: #68c958;
  background: #68c958;
}

.ma-workspace-main li.is-current {
  color: var(--white);
}

.ma-workspace-main li.is-current::before {
  border-color: var(--signal);
  box-shadow: 0 0 0 4px rgba(238, 29, 11, 0.12);
}

.ma-adapt-metrics {
  padding: 28px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.ma-adapt-metrics div {
  min-height: 118px;
  padding: 16px;
  display: grid;
  align-content: space-between;
  border: 1px solid var(--ma-panel-line);
  border-radius: 8px;
}

.ma-adapt-metrics span,
.ma-adapt-metrics small {
  color: rgba(246, 246, 244, 0.4);
  font-size: 9px;
}

.ma-adapt-metrics strong {
  color: #79d76a;
  font-size: clamp(30px, 3vw, 44px);
  font-weight: 500;
  letter-spacing: -0.06em;
}

.ma-adapt-list {
  margin: 0 28px;
  border-top: 1px solid var(--ma-panel-line);
}

.ma-adapt-list p {
  min-height: 54px;
  margin: 0;
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 12px;
  align-items: center;
  border-bottom: 1px solid var(--ma-panel-line);
  font-size: 10px;
}

.ma-adapt-list span {
  color: rgba(246, 246, 244, 0.46);
}

.ma-adapt-list b {
  font-size: 11px;
  font-weight: 500;
}

.ma-adapt-list em {
  color: #79d76a;
  font-size: 8px;
  font-style: normal;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.ma-adapt-note {
  margin: 24px 28px 0;
  padding: 15px 17px;
  color: rgba(246, 246, 244, 0.62);
  border-left: 2px solid var(--signal);
  background: rgba(255, 255, 255, 0.035);
  font-size: 11px;
  line-height: 1.35;
}

.ma-closing {
  min-height: 86svh;
  padding: 110px 24px;
  display: grid;
  place-items: center;
  color: var(--white);
  background:
    radial-gradient(circle at 50% 50%, rgba(33, 96, 128, 0.14), transparent 33%),
    var(--black);
  text-align: center;
}

.ma-closing > div {
  width: min(980px, 100%);
  display: grid;
  justify-items: center;
}

.ma-closing p {
  margin: 0 0 30px;
  color: rgba(246, 246, 244, 0.48);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.ma-closing h2 {
  margin: 0;
  font-size: clamp(60px, 7.5vw, 116px);
  font-weight: 500;
  line-height: 0.9;
  letter-spacing: -0.075em;
}

.ma-closing a {
  min-width: 226px;
  min-height: 56px;
  margin-top: 58px;
  padding: 0 22px;
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  color: var(--white);
  background: var(--signal);
  border-radius: 5px;
  font-size: 14px;
  font-weight: 600;
  transition: color 180ms ease, background 180ms ease, transform 180ms ease;
}

.ma-closing a:hover,
.ma-closing a:focus-visible {
  color: var(--signal);
  background: var(--white);
  transform: translateY(-2px);
}

.ma-footer {
  min-height: 72px;
  padding: 0 max(24px, calc((100% - 1248px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: rgba(246, 246, 244, 0.46);
  background: var(--black);
  border-top: 1px solid var(--line);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.ma-footer p {
  margin: 0;
}

@keyframes ma-bar-in {
  from {
    width: 0;
  }
}

@keyframes ma-pulse {
  0%,
  100% {
    opacity: 0.45;
  }

  50% {
    opacity: 1;
  }
}

@media (max-width: 1120px) {
  .ma-capability-inner {
    grid-template-columns: minmax(0, 0.78fr) minmax(470px, 1.22fr);
    gap: 54px;
  }

  .ma-capability h2 {
    font-size: clamp(48px, 5vw, 64px);
  }
}

@media (max-width: 900px) {
  .ma-capability {
    min-height: 0;
    padding: 98px 24px 110px;
  }

  .ma-capability-inner {
    grid-template-columns: 1fr;
    gap: 64px;
  }

  .ma-capability-copy {
    max-width: 700px;
  }

  .ma-capability h2,
  .ma-description,
  .ma-core-idea {
    max-width: 700px;
  }

  .ma-demo {
    width: min(720px, 100%);
  }
}

@media (max-width: 700px) {
  .ma-hero {
    min-height: calc(100svh - 76px);
    padding: 76px 20px 92px;
    background-size: auto, 48px 48px, 48px 48px, auto;
  }

  .ma-eyebrow {
    margin-bottom: 26px;
    font-size: 9px;
  }

  .ma-title {
    font-size: clamp(50px, 14.8vw, 68px);
    line-height: 0.94;
  }

  .ma-title-invert {
    width: auto;
  }

  .ma-intro {
    margin-top: 34px;
    font-size: 18px;
  }

  .ma-hero-metrics {
    margin-top: 52px;
    grid-template-columns: 1fr;
  }

  .ma-hero-metrics p {
    min-height: 84px;
    padding: 18px;
  }

  .ma-hero-metrics p + p {
    border-top: 1px solid var(--line);
    border-left: 0;
  }

  .ma-scroll-link {
    margin-top: 38px;
  }

  .ma-capability {
    padding: 82px 20px 92px;
  }

  .ma-capability-inner {
    gap: 50px;
  }

  .ma-index {
    margin-bottom: 26px;
  }

  .ma-capability h2 {
    font-size: clamp(44px, 13vw, 58px);
    line-height: 0.96;
  }

  .ma-description {
    margin-top: 28px;
    font-size: 17px;
  }

  .ma-core-idea {
    margin-top: 28px;
    padding: 17px 18px;
    font-size: 19px;
  }

  .ma-tags {
    margin-top: 32px;
  }

  .ma-tags span {
    min-height: 32px;
    padding: 0 11px;
    font-size: 10px;
  }

  .ma-demo {
    min-height: 0;
    border-radius: 12px;
  }

  .ma-demo-bar {
    min-height: 50px;
    padding: 0 14px;
    gap: 11px;
  }

  .ma-demo-status {
    max-width: 78px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ma-token-task,
  .ma-route-request {
    margin: 20px;
  }

  .ma-token-bars {
    margin: 26px 20px 0;
  }

  .ma-token-bars > div {
    grid-template-columns: 96px 1fr 44px;
    gap: 10px;
  }

  .ma-terminal-lines {
    margin: 28px 20px 0;
    padding: 19px 16px 24px;
  }

  .ma-memory-query {
    margin: 20px 20px 0 auto;
    max-width: calc(100% - 40px);
  }

  .ma-memory-list {
    margin: 20px;
  }

  .ma-memory-list article {
    padding: 15px;
    grid-template-columns: 1fr;
  }

  .ma-memory-list article > span {
    grid-row: auto;
  }

  .ma-tool-plan,
  .ma-code-window {
    padding-right: 20px;
    padding-left: 20px;
  }

  .ma-code-window {
    overflow-x: auto;
  }

  .ma-code-window code {
    width: max-content;
    min-width: 100%;
  }

  .ma-route-map {
    margin: 0 20px;
    grid-template-columns: 1fr;
  }

  .ma-route-result {
    margin: 22px 20px 24px;
  }

  .ma-workspace-layout {
    min-height: 0;
    grid-template-columns: 1fr;
  }

  .ma-workspace-layout aside {
    padding: 16px;
    grid-template-columns: repeat(3, 1fr);
    border-right: 0;
    border-bottom: 1px solid var(--ma-panel-line);
  }

  .ma-workspace-layout aside strong {
    grid-column: 1 / -1;
    margin-bottom: 8px;
  }

  .ma-workspace-layout aside span {
    padding: 0 6px;
    justify-content: center;
  }

  .ma-workspace-layout aside span:nth-of-type(n + 4) {
    display: none;
  }

  .ma-workspace-layout aside b {
    display: none;
  }

  .ma-workspace-main {
    padding: 20px;
  }

  .ma-adapt-metrics {
    padding: 20px;
    grid-template-columns: 1fr;
  }

  .ma-adapt-metrics div {
    min-height: 92px;
  }

  .ma-adapt-list {
    margin: 0 20px;
  }

  .ma-adapt-list p {
    padding: 12px 0;
    grid-template-columns: 1fr auto;
  }

  .ma-adapt-list b {
    grid-column: 1 / -1;
    grid-row: 2;
  }

  .ma-adapt-list em {
    grid-column: 2;
    grid-row: 1;
  }

  .ma-adapt-note {
    margin: 22px 20px 24px;
  }

  .ma-closing {
    min-height: 72svh;
    padding: 92px 20px;
  }

  .ma-closing h2 {
    font-size: clamp(52px, 15vw, 72px);
  }

  .ma-footer {
    min-height: 64px;
    padding: 0 20px;
  }
}

@media (max-width: 380px) {
  .ma-hero,
  .ma-capability,
  .ma-closing {
    padding-right: 16px;
    padding-left: 16px;
  }

  .ma-title {
    font-size: 49px;
  }

  .ma-token-bars > div {
    grid-template-columns: 84px 1fr 40px;
    font-size: 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .ma-page *,
  .ma-page *::before,
  .ma-page *::after {
    animation: none !important;
  }
}

/* Mosaic Agent — Apple-style motion system */
.ma-motion-ready .ma-site-header {
  opacity: 0;
  transform: translateY(-18px);
  transition:
    opacity 900ms 80ms cubic-bezier(0.16, 1, 0.3, 1),
    transform 900ms 80ms cubic-bezier(0.16, 1, 0.3, 1);
}

.ma-motion-ready.ma-loaded .ma-site-header {
  opacity: 1;
  transform: translateY(0);
}

.ma-motion-ready .ma-hero {
  --ma-hero-progress: 0;
}

.ma-motion-ready .ma-hero::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(86vw, 1060px);
  aspect-ratio: 1;
  border: 1px solid rgba(246, 246, 244, 0.1);
  border-radius: 50%;
  opacity: calc(0.72 - var(--ma-hero-progress) * 0.62);
  transform:
    translate3d(
      -50%,
      calc(-50% - var(--ma-hero-progress) * 110px),
      0
    )
    scale(calc(0.9 + var(--ma-hero-progress) * 0.2));
  pointer-events: none;
  will-change: opacity, transform;
}

.ma-motion-ready .ma-hero-inner {
  position: relative;
  z-index: 1;
  opacity: calc(1 - var(--ma-hero-progress) * 0.82);
  filter: blur(calc(var(--ma-hero-progress) * 8px));
  transform:
    translate3d(0, calc(var(--ma-hero-progress) * -54px), 0)
    scale(calc(1 - var(--ma-hero-progress) * 0.055));
  transform-origin: center center;
  will-change: opacity, filter, transform;
}

.ma-motion-ready .ma-title-invert {
  background-image:
    linear-gradient(90deg, #ffffff 0 50%, #e8e8e4 50% 100%);
  background-size: 210% 100%;
  background-position: 100% 0;
  transition: background-position 1400ms 360ms cubic-bezier(0.16, 1, 0.3, 1);
}

.ma-motion-ready.ma-loaded .ma-title-invert {
  background-position: 0 0;
}

.ma-motion-ready .ma-hero-metrics p {
  opacity: 0;
  transform: translateY(24px);
  transition:
    opacity 900ms cubic-bezier(0.16, 1, 0.3, 1),
    transform 900ms cubic-bezier(0.16, 1, 0.3, 1);
}

.ma-motion-ready.ma-loaded .ma-hero-metrics p {
  opacity: 1;
  transform: translateY(0);
}

.ma-motion-ready.ma-loaded .ma-hero-metrics p:nth-child(1) {
  transition-delay: 520ms;
}

.ma-motion-ready.ma-loaded .ma-hero-metrics p:nth-child(2) {
  transition-delay: 620ms;
}

.ma-motion-ready.ma-loaded .ma-hero-metrics p:nth-child(3) {
  transition-delay: 720ms;
}

.ma-motion-ready .ma-capability {
  --ma-focus: 0;
  --ma-progress: 0;
}

.ma-motion-ready .ma-capability::after {
  content: "";
  position: absolute;
  z-index: 0;
  top: 12%;
  right: -13vw;
  width: min(58vw, 760px);
  aspect-ratio: 1;
  border: 1px solid currentColor;
  border-radius: 50%;
  opacity: calc(var(--ma-focus) * 0.045);
  transform:
    translate3d(
      calc((0.5 - var(--ma-progress)) * 100px),
      calc((0.5 - var(--ma-progress)) * -76px),
      0
    )
    scale(calc(0.84 + var(--ma-focus) * 0.16));
  pointer-events: none;
  will-change: opacity, transform;
}

.ma-motion-ready .ma-capability-inner {
  position: relative;
  z-index: 1;
}

.ma-motion-ready .ma-capability-copy .ma-index {
  opacity: 0;
  transform: translateY(18px);
  transition:
    opacity 720ms 40ms cubic-bezier(0.16, 1, 0.3, 1),
    transform 720ms 40ms cubic-bezier(0.16, 1, 0.3, 1);
}

.ma-motion-ready .ma-capability-copy h2 {
  opacity: 0;
  clip-path: inset(0 0 100% 0);
  transform: translateY(44px);
  transition:
    opacity 960ms 80ms cubic-bezier(0.16, 1, 0.3, 1),
    clip-path 1100ms 80ms cubic-bezier(0.16, 1, 0.3, 1),
    transform 1100ms 80ms cubic-bezier(0.16, 1, 0.3, 1);
}

.ma-motion-ready .ma-capability-copy .ma-description,
.ma-motion-ready .ma-capability-copy .ma-core-idea {
  opacity: 0;
  transform: translateY(28px);
  transition:
    opacity 900ms cubic-bezier(0.16, 1, 0.3, 1),
    transform 900ms cubic-bezier(0.16, 1, 0.3, 1);
}

.ma-motion-ready .ma-capability-copy .ma-description {
  transition-delay: 180ms;
}

.ma-motion-ready .ma-capability-copy .ma-core-idea {
  transition-delay: 260ms;
}

.ma-motion-ready .ma-tags span {
  opacity: 0;
  transform: translateY(14px) scale(0.96);
  transition:
    opacity 620ms cubic-bezier(0.16, 1, 0.3, 1),
    transform 620ms cubic-bezier(0.16, 1, 0.3, 1),
    color 180ms ease,
    background 180ms ease;
}

.ma-motion-ready .ma-capability.ma-in-view .ma-index,
.ma-motion-ready .ma-capability.ma-in-view h2,
.ma-motion-ready .ma-capability.ma-in-view .ma-description,
.ma-motion-ready .ma-capability.ma-in-view .ma-core-idea,
.ma-motion-ready .ma-capability.ma-in-view .ma-tags span {
  opacity: 1;
  clip-path: inset(0 0 0 0);
  transform: translateY(0) scale(1);
}

.ma-motion-ready .ma-capability.ma-in-view .ma-tags span:nth-child(1) {
  transition-delay: 300ms;
}

.ma-motion-ready .ma-capability.ma-in-view .ma-tags span:nth-child(2) {
  transition-delay: 350ms;
}

.ma-motion-ready .ma-capability.ma-in-view .ma-tags span:nth-child(3) {
  transition-delay: 400ms;
}

.ma-motion-ready .ma-capability.ma-in-view .ma-tags span:nth-child(4) {
  transition-delay: 450ms;
}

.ma-motion-ready .ma-capability.ma-in-view .ma-tags span:nth-child(5) {
  transition-delay: 500ms;
}

.ma-motion-ready .ma-capability.ma-in-view .ma-tags span:nth-child(6) {
  transition-delay: 550ms;
}

.ma-motion-ready .ma-demo {
  --ma-tilt-x: 0deg;
  --ma-tilt-y: 0deg;
  --ma-glow-x: 50%;
  --ma-glow-y: 50%;
  opacity: calc(0.54 + var(--ma-focus) * 0.46);
  filter: blur(calc((1 - var(--ma-focus)) * 5px));
  transform:
    perspective(1300px)
    translate3d(0, calc((1 - var(--ma-focus)) * 52px), 0)
    scale(calc(0.94 + var(--ma-focus) * 0.06))
    rotateX(calc(var(--ma-tilt-x) + (1 - var(--ma-focus)) * 3deg))
    rotateY(var(--ma-tilt-y));
  transform-origin: center center;
  transition:
    box-shadow 360ms ease,
    border-color 360ms ease;
  will-change: opacity, filter, transform;
}

.ma-motion-ready .ma-demo::before {
  content: "";
  position: absolute;
  z-index: 4;
  inset: 0;
  opacity: 0;
  background:
    radial-gradient(
      circle at var(--ma-glow-x) var(--ma-glow-y),
      rgba(255, 255, 255, 0.12),
      transparent 34%
    );
  transition: opacity 360ms ease;
  pointer-events: none;
}

.ma-motion-ready .ma-demo:hover {
  border-color: rgba(255, 255, 255, 0.25);
  box-shadow:
    0 48px 110px rgba(0, 0, 0, 0.36),
    inset 0 1px rgba(255, 255, 255, 0.08);
}

.ma-motion-ready .ma-demo:hover::before {
  opacity: 1;
}

.ma-motion-ready .ma-demo > * {
  opacity: 0;
  transform: translateY(18px);
  transition:
    opacity 760ms cubic-bezier(0.16, 1, 0.3, 1),
    transform 760ms cubic-bezier(0.16, 1, 0.3, 1);
}

.ma-motion-ready .ma-capability.ma-in-view .ma-demo > * {
  opacity: 1;
  transform: translateY(0);
}

.ma-motion-ready .ma-capability.ma-in-view .ma-demo > :nth-child(1) {
  transition-delay: 180ms;
}

.ma-motion-ready .ma-capability.ma-in-view .ma-demo > :nth-child(2) {
  transition-delay: 280ms;
}

.ma-motion-ready .ma-capability.ma-in-view .ma-demo > :nth-child(3) {
  transition-delay: 380ms;
}

.ma-motion-ready .ma-capability.ma-in-view .ma-demo > :nth-child(4) {
  transition-delay: 480ms;
}

.ma-motion-ready .ma-route-map .is-selected {
  animation: ma-route-breathe 2.8s ease-in-out infinite;
}

.ma-motion-ready .ma-workspace-main li.is-current::before {
  animation: ma-current-task 1.8s ease-in-out infinite;
}

.ma-motion-ready .ma-adapt-metrics strong {
  display: inline-block;
  animation: ma-metric-float 4s ease-in-out infinite;
}

.ma-motion-ready .ma-adapt-metrics div:nth-child(2) strong {
  animation-delay: 260ms;
}

.ma-motion-ready .ma-adapt-metrics div:nth-child(3) strong {
  animation-delay: 520ms;
}

.ma-motion-ready .ma-closing > div {
  transform: translateY(calc((1 - var(--ma-closing-focus, 1)) * 40px));
}

@keyframes ma-route-breathe {
  0%,
  100% {
    box-shadow: inset 0 0 0 rgba(238, 29, 11, 0);
  }

  50% {
    box-shadow: inset 0 0 32px rgba(238, 29, 11, 0.13);
  }
}

@keyframes ma-current-task {
  0%,
  100% {
    box-shadow: 0 0 0 4px rgba(238, 29, 11, 0.1);
  }

  50% {
    box-shadow: 0 0 0 8px rgba(238, 29, 11, 0.02);
  }
}

@keyframes ma-metric-float {
  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-4px);
  }
}

@media (max-width: 900px) {
  .ma-motion-ready .ma-demo {
    opacity: 1;
    filter: none;
    transform:
      perspective(1200px)
      rotateX(var(--ma-tilt-x))
      rotateY(var(--ma-tilt-y));
  }

  .ma-motion-ready .ma-capability::after {
    right: -42vw;
    width: 92vw;
  }
}

@media (max-width: 700px) {
  .ma-motion-ready .ma-hero-inner {
    opacity: 1;
    filter: none;
    transform: translate3d(0, calc(var(--ma-hero-progress) * -24px), 0);
  }

  .ma-motion-ready .ma-hero::before {
    width: 124vw;
  }

  .ma-motion-ready .ma-demo {
    transform: none;
  }

  .ma-motion-ready .ma-demo:hover {
    box-shadow:
      0 28px 70px rgba(0, 0, 0, 0.28),
      inset 0 1px rgba(255, 255, 255, 0.05);
  }
}

@media (prefers-reduced-motion: reduce) {
  .ma-motion-reduced .ma-capability-copy h2,
  .ma-motion-reduced .ma-capability-copy .ma-index,
  .ma-motion-reduced .ma-capability-copy .ma-description,
  .ma-motion-reduced .ma-capability-copy .ma-core-idea,
  .ma-motion-reduced .ma-tags span,
  .ma-motion-reduced .ma-demo,
  .ma-motion-reduced .ma-demo > * {
    opacity: 1 !important;
    clip-path: none !important;
    filter: none !important;
    transform: none !important;
  }
}
