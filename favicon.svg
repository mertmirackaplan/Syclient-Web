  margin: 0 0 30px;
  color: rgba(246, 246, 244, 0.46);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.agent-closing h2 {
  margin: 0;
  font-size: clamp(62px, 8vw, 122px);
  font-weight: 500;
  line-height: 0.88;
  letter-spacing: -0.078em;
  text-wrap: balance;
}

.agent-footer {
  min-height: 72px;
  padding: 0 max(24px, calc((100% - 1248px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  color: rgba(246, 246, 244, 0.46);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.agent-footer p {
  margin: 0;
}

.agent-page {
  position: relative;
  overflow: clip;
  background: var(--black);
}

.agent-type-char {
  display: inline-block;
  opacity: 0;
  filter: blur(7px);
  transform: translate3d(0, 0.34em, 0) scale(0.96);
  transform-origin: 50% 100%;
  will-change: opacity, filter, transform;
}

.agent-type-run {
  display: inline;
}

.agent-type-word {
  display: inline-block;
  white-space: nowrap;
}

.agent-type-ready.is-typing:not(a)::after {
  content: "";
  width: 0.075em;
  height: 0.82em;
  margin-left: 0.08em;
  display: inline-block;
  vertical-align: -0.08em;
  background: currentColor;
  animation: agent-type-cursor 620ms steps(1, end) infinite;
}

.agent-type-ready.is-typing .agent-type-char {
  animation:
    agent-type-in 680ms calc(var(--type-start, 0ms) + var(--char-delay))
    cubic-bezier(0.16, 1, 0.3, 1) both;
}

.agent-type-ready.is-typed .agent-type-char {
  opacity: 1;
  filter: blur(0);
  transform: translate3d(0, 0, 0) scale(1);
}

.agent-page [data-count] {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

.agent-stage {
  --agent-focus: 1;
  --agent-progress: 0;
  position: relative;
  min-height: 145svh;
}

.agent-stage-sticky {
  position: sticky;
  top: 0;
  min-height: 100svh;
  padding: clamp(86px, 10vh, 120px) 24px;
  display: grid;
  place-items: center;
  overflow: hidden;
  perspective: 1400px;
}

.agent-stage:not(.agent-hero) .agent-stage-sticky::before {
  content: "";
  position: absolute;
  z-index: 0;
  top: 50%;
  left: 50%;
  width: min(84vw, 1040px);
  aspect-ratio: 1;
  border: 1px solid currentColor;
  border-radius: 50%;
  opacity: calc(var(--agent-focus) * 0.055);
  transform:
    translate3d(
      -50%,
      calc(-50% + (0.5 - var(--agent-progress)) * 120px),
      -120px
    )
    scale(calc(0.82 + var(--agent-focus) * 0.22));
  pointer-events: none;
  will-change: opacity, transform;
}

.agent-stage-card {
  position: relative;
  z-index: 1;
  width: min(1248px, 100%);
  transition:
    opacity 80ms linear,
    transform 80ms linear,
    filter 80ms linear;
  will-change: opacity, transform, filter;
}

.motion-ready [data-agent-stage] .agent-stage-card {
  opacity: calc(0.14 + var(--agent-focus) * 0.86);
  filter: blur(calc((1 - var(--agent-focus)) * 12px));
  transform:
    translate3d(0, calc((1 - var(--agent-focus)) * 68px), 0)
    scale(calc(0.92 + var(--agent-focus) * 0.08))
    rotateX(calc((1 - var(--agent-focus)) * 4deg));
}

@keyframes agent-type-in {
  0% {
    opacity: 0;
    filter: blur(7px);
    transform: translate3d(0, 0.34em, 0) scale(0.96);
  }

  55% {
    opacity: 1;
  }

  100% {
    opacity: 1;
    filter: blur(0);
    transform: translate3d(0, 0, 0) scale(1);
  }
}

@keyframes agent-type-cursor {
  0%,
  46% {
    opacity: 1;
  }

  47%,
  100% {
    opacity: 0;
  }
}

.agent-dark {
  color: var(--white);
  background: var(--black);
}

.agent-light {
  position: relative;
  color: #0a0a0a;
  background: #f1f1ec;
}

.agent-light::before {
  z-index: 3;
  transform: none;
}

.agent-hero {
  min-height: 155svh;
  padding: 0;
  display: block;
  color: var(--white);
  background:
    radial-gradient(circle at 50% 48%, rgba(33, 96, 128, 0.14), transparent 34%),
    var(--black);
}

.agent-hero::before {
  display: none;
}

.agent-hero .agent-stage-sticky {
  min-height: calc(100svh - 92px);
}

.agent-hero-card {
  display: grid;
  justify-items: center;
  text-align: center;
}

.agent-orb {
  position: absolute;
  z-index: -1;
  top: 50%;
  left: 50%;
  width: min(74vw, 900px);
  aspect-ratio: 1;
  border: 1px solid rgba(246, 246, 244, 0.09);
  border-radius: 50%;
  background:
    radial-gradient(
      circle,
      rgba(53, 130, 165, 0.12),
      rgba(0, 0, 0, 0) 64%
    );
  transform:
    translate(-50%, calc(-50% - var(--agent-progress) * 90px))
    scale(calc(1 + var(--agent-progress) * 0.12));
  will-change: transform;
}

.agent-kicker {
  margin: 0 0 30px;
  color: rgba(246, 246, 244, 0.56);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.agent-hero h1 {
  width: min(1120px, 100%);
  max-width: none;
  margin: 0;
  font-size: clamp(64px, 7.2vw, 112px);
  font-weight: 500;
  line-height: 0.91;
  letter-spacing: -0.068em;
  text-wrap: initial;
}

.agent-hero-title-line {
  display: block;
  white-space: nowrap;
}

.agent-hero h1 .agent-word-highlight {
  display: inline-block;
  padding: 0.03em 0.12em 0.1em;
  color: #050505;
  background: #ffffff;
  border-radius: 2px;
  line-height: 0.88;
}

.agent-word-highlight .agent-type-char {
  color: inherit;
}

.agent-lead {
  max-width: 640px;
  margin: clamp(38px, 5vh, 56px) 0 0;
  color: rgba(246, 246, 244, 0.68);
  font-size: clamp(18px, 1.7vw, 25px);
  line-height: 1.28;
  letter-spacing: -0.03em;
}

.agent-scroll-cue {
  margin-top: clamp(46px, 7vh, 72px);
  display: inline-flex;
  align-items: center;
  gap: 22px;
  color: var(--white);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.agent-scroll-cue > .agent-scroll-icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(246, 246, 244, 0.32);
  border-radius: 50%;
  transition:
    color 180ms ease,
    background 180ms ease,
    transform 180ms ease;
}

.agent-scroll-cue:hover > .agent-scroll-icon,
.agent-scroll-cue:focus-visible > .agent-scroll-icon {
  color: var(--black);
  background: var(--white);
  transform: translateY(3px);
}

.agent-content-frame {
  padding: clamp(44px, 5vw, 72px) 0;
}

.agent-section-heading {
  display: grid;
  grid-template-columns: 190px minmax(0, 1fr);
  gap: clamp(56px, 5vw, 80px);
  align-items: start;
}

.agent-section-heading > p {
  margin: 12px 0 0;
  color: currentColor;
  opacity: 0.68;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.agent-section-heading h2 {
  max-width: 960px;
  margin: 0;
  font-size: clamp(58px, 7vw, 108px);
  font-weight: 500;
  line-height: 0.9;
  letter-spacing: -0.073em;
  text-wrap: balance;
}

.agent-section-heading .agent-key-heading {
  width: 100%;
  max-width: none;
  font-size: clamp(64px, 5.4vw, 86px);
  line-height: 0.96;
  letter-spacing: -0.062em;
  text-wrap: initial;
}

.agent-heading-line {
  display: block;
  white-space: nowrap;
}

.agent-efficiency-grid {
  margin-top: clamp(86px, 11vh, 134px);
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-top: 1px solid rgba(10, 10, 10, 0.76);
  border-bottom: 1px solid rgba(10, 10, 10, 0.76);
}

.agent-efficiency-grid article {
  min-height: 260px;
  padding: 28px clamp(24px, 3.5vw, 54px);
  display: grid;
  grid-template-rows: auto 1fr auto;
}

.agent-efficiency-grid article:first-child {
  padding-left: 0;
}

.agent-efficiency-grid article:last-child {
  padding-right: 0;
}

.agent-efficiency-grid article + article {
  border-left: 1px solid rgba(10, 10, 10, 0.24);
}

.agent-efficiency-grid article > span,
.agent-stack-list > article > span,
.agent-use-grid article > span {
  color: rgba(10, 10, 10, 0.55);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
}

.agent-efficiency-grid h3 {
  align-self: center;
  margin: 0;
  font-size: clamp(40px, 3.5vw, 58px);
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.045em;
}

.agent-efficiency-grid p {
  max-width: 300px;
  margin: 0;
  color: rgba(10, 10, 10, 0.7);
  font-size: 18px;
  line-height: 1.42;
}

.agent-flow {
  margin-top: clamp(84px, 11vh, 132px);
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border: 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.agent-flow > div {
  min-height: 170px;
  padding: 24px 18px;
  display: grid;
  align-content: space-between;
  border: 0;
}

.agent-flow > div + div {
  border-left: 1px solid var(--line);
}

.agent-flow > div > span {
  color: rgba(246, 246, 244, 0.52);
  font-size: 12px;
  font-weight: 600;
}

.agent-flow p {
  margin: 0;
  font-size: clamp(26px, 2.1vw, 34px);
  font-weight: 500;
  letter-spacing: -0.03em;
}

.agent-stack-heading {
  padding-bottom: clamp(68px, 9vh, 104px);
  border-bottom: 1px solid rgba(10, 10, 10, 0.76);
}

.agent-stack-list article {
  min-height: 126px;
  display: grid;
  grid-template-columns: 0.18fr minmax(240px, 0.65fr) 1fr;
  gap: clamp(28px, 5vw, 80px);
  align-items: center;
  border-bottom: 1px solid rgba(10, 10, 10, 0.24);
}

.agent-stack-list h3,
.agent-stack-list p {
  margin: 0;
}

.agent-stack-list h3 {
  font-size: clamp(26px, 3vw, 44px);
  font-weight: 500;
  letter-spacing: -0.052em;
}

.agent-stack-list p {
  color: rgba(10, 10, 10, 0.58);
  font-size: 15px;
}

.agent-two {
  background:
    radial-gradient(circle at 70% 42%, rgba(33, 96, 128, 0.18), transparent 34%),
    var(--black);
}

.agent-two-card {
  display: grid;
  justify-items: center;
  text-align: center;
}

.agent-two-card h2 {
  max-width: 940px;
  margin: 0;
  font-size: clamp(56px, 7vw, 108px);
  font-weight: 500;
  line-height: 0.9;
  letter-spacing: -0.073em;
  text-wrap: balance;
}

.agent-two-metrics {
  width: min(920px, 100%);
  margin-top: clamp(64px, 9vh, 104px);
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.agent-two-metrics > div {
  min-height: 220px;
  padding: 28px;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 28px;
}

.agent-two-metrics > div + div {
  border-left: 1px solid var(--line);
}

.agent-two-metrics strong {
  font-size: clamp(78px, 10vw, 154px);
  font-weight: 500;
  line-height: 0.72;
  letter-spacing: -0.08em;
}

.agent-two-metrics > div > span {
  color: rgba(246, 246, 244, 0.48);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.agent-two-note {
  margin: 42px 0 0;
  color: rgba(246, 246, 244, 0.62);
  font-size: 15px;
}

.agent-use-grid {
  margin-top: clamp(84px, 11vh, 132px);
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid rgba(10, 10, 10, 0.76);
  border-bottom: 1px solid rgba(10, 10, 10, 0.76);
}

.agent-use-grid article {
  min-height: 220px;
  padding: 28px clamp(20px, 2.8vw, 42px);
  display: grid;
  align-content: space-between;
}

.agent-use-grid article:first-child {
  padding-left: 0;
}

.agent-use-grid article:last-child {
  padding-right: 0;
}

.agent-use-grid article + article {
  border-left: 1px solid rgba(10, 10, 10, 0.24);
}

.agent-use-grid h3 {
  margin: 0;
  font-size: clamp(34px, 3.1vw, 50px);
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.04em;
}

.agent-work,
.agent-work .agent-stage-sticky {
  color: var(--white);
  background: var(--black);
}

.agent-work .agent-use-grid {
  border-color: var(--line);
}

.agent-work .agent-use-grid article + article {
  border-left-color: var(--line);
}

.agent-work .agent-use-grid article > span {
  color: rgba(246, 246, 244, 0.42);
}

.agent-work .agent-use-grid h3 {
  color: var(--white);
}

.agent-final {
  min-height: 130svh;
}

.agent-final-card {
  display: grid;
  justify-items: center;
  text-align: center;
}

.agent-final-card > p {
  margin: 0 0 30px;
  color: rgba(246, 246, 244, 0.48);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.agent-final-card h2 {
  max-width: 980px;
  margin: 0;
  font-size: clamp(58px, 7.4vw, 114px);
  font-weight: 500;
  line-height: 0.9;
  letter-spacing: -0.075em;
  text-wrap: balance;
}

.agent-final-card a {
  min-width: 210px;
  min-height: 56px;
  margin-top: clamp(52px, 7vh, 76px);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  border-radius: 5px;
  color: var(--white);
  background: var(--signal);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.01em;
  transition:
    color 180ms ease,
    background 180ms ease,
    transform 180ms ease;
}

.agent-final-card a:hover,
.agent-final-card a:focus-visible {
  color: var(--signal);
  background: var(--white);
  transform: translateY(-2px);
}

.agent-footer {
  color: rgba(246, 246, 244, 0.46);
  background: var(--black);
}

@keyframes spm-orbit-in {
  from {
    opacity: 0;
    transform: scale(0.84);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes image-reveal {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.985);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes header-in {
  from {
    opacity: 0;
    transform: translateY(-14px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes copy-reveal {
  from {
    opacity: 0;
    transform: translateY(14px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 1040px) {
  .header-inner {
    grid-template-columns: 1fr auto;
  }

  .desktop-nav,
  .contact-button {
    display: none;
  }

  .mobile-nav {
    display: block;
    position: relative;
    justify-self: end;
  }

  .mobile-nav summary {
    width: 76px;
    height: 40px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(246, 246, 244, 0.72);
    border-radius: 6px;
    cursor: pointer;
    list-style: none;
    font-size: 11px;
    font-weight: 600;
  }

  .mobile-nav summary::-webkit-details-marker {
    display: none;
  }

  .mobile-nav[open] summary {
    color: var(--black);
    background: var(--white);
  }

  .mobile-nav-panel {
    position: fixed;
    top: 66px;
    right: 20px;
    width: min(340px, calc(100vw - 40px));
    max-height: calc(100svh - 86px);
    padding: 12px 20px;
    display: grid;
    overflow-y: auto;
    overscroll-behavior: contain;
    color: var(--white);
    background: #0b0b0b;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.58);
    scrollbar-width: thin;
  }

  .mobile-nav-panel a {
    padding: 17px 0;
    display: grid;
    grid-template-columns: 42px 1fr;
    border-bottom: 1px solid var(--line);
    color: #ffffff;
    font-size: 15px;
  }

  .mobile-nav-panel a:last-child {
    border-bottom: 0;
  }

  .mobile-nav-panel span {
    color: var(--muted);
    font-size: 9px;
  }

  .mobile-product-label,
  .mobile-product-disabled {
    margin: 0;
    padding: 16px 0;
    display: grid;
    grid-template-columns: 42px 1fr;
    align-items: center;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
  }

  .mobile-product-label {
    color: rgba(246, 246, 244, 0.48);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .mobile-nav-panel .mobile-product-link {
    padding-left: 14px;
    grid-template-columns: 48px 1fr;
  }

  .mobile-product-disabled {
    padding-left: 14px;
    grid-template-columns: 48px 1fr;
    color: rgba(246, 246, 244, 0.38);
    cursor: not-allowed;
  }

  .mobile-product-disabled small {
    margin-left: 8px;
    font-size: 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .product-copy {
    width: min(1040px, 88vw);
  }

  .model-copy {
    width: min(760px, 100%);
  }

  .model-cta {
    margin-right: auto;
    margin-left: auto;
  }

  .research-header,
  .research-thesis,
  .dark-section-header {
    grid-template-columns: 180px 1fr;
    gap: 54px;
  }

  .research-direction,
  .about-inner {
    grid-template-columns: 1fr;
  }

  .research-planes,
  .about-copy {
    max-width: 720px;
  }

  .about-copy > p {
    margin-top: 0;
  }

  .spm-section-header,
  .spm-architecture-header,
  .spm-dark-header,
  .agent-section-header,
  .agent-dark-header,
  .agent-two-header,
  .agent-roadmap-header {
    grid-template-columns: 180px 1fr;
    gap: 54px;
  }
}

@media (max-width: 700px) {
  .header-inner,
  .product-hero {
    width: calc(100% - 40px);
  }

  .header-inner {
    height: 76px;
  }

  .brand,
  .wordmark {
    width: 142px;
    height: 24px;
  }

  .wordmark img {
    top: -45px;
    left: -10px;
    width: 169px;
  }

  .product-hero {
    min-height: calc(100svh - 76px);
    padding: 58px 0 64px;
  }

  .product-copy {
    width: 100%;
  }

  .product-copy h1 {
    font-size: clamp(43px, 12vw, 60px);
    line-height: 1.01;
  }

  .primary-cta {
    min-width: 208px;
    margin-top: 56px;
  }

  .model-section-inner {
    width: calc(100% - 40px);
    padding: 70px 0 78px;
  }

  .model-copy h2 {
    font-size: clamp(36px, 10.5vw, 50px);
  }

  .model-copy p {
    margin-top: 22px;
    font-size: 18px;
  }

  .model-cta {
    margin-top: 32px;
  }

  .research-inner,
  .news-inner,
  .about-inner {
    width: calc(100% - 40px);
  }

  .research-inner {
    padding: 78px 0 90px;
  }

  .research-header,
  .research-thesis,
  .dark-section-header {
    grid-template-columns: 1fr;
    gap: 44px;
  }

  .research-meta p:last-child {
    margin-top: 20px;
  }

  .research-title-block h2 {
    max-width: 100%;
    font-size: clamp(47px, 13.2vw, 62px);
    line-height: 0.91;
    overflow-wrap: break-word;
  }

  .research-intro {
    margin-top: 38px;
    max-width: 100%;
    font-size: 18px;
    overflow-wrap: break-word;
  }

  .research-thesis {
    margin-top: 76px;
  }

  .research-areas-heading {
    margin-top: 84px;
  }

  .research-areas-heading p {
    display: none;
  }

  .research-grid {
    grid-template-columns: 1fr;
  }

  .research-card,
  .research-card:first-child,
  .research-card:not(:last-child),
  .research-card:last-child {
    min-height: 0;
    padding: 28px 0 34px;
    border-right: 0;
  }

  .research-number {
    margin-bottom: 38px;
  }

  .research-direction {
    margin-top: 90px;
